name: "NSM Flow Desktop Build"

# The default is the Apple-silicon build used for Jason's Mac. The complete
# Intel Mac + Windows matrix remains available when a release genuinely needs it.
on:
  workflow_dispatch:
    inputs:
      build_scope:
        description: "Installer platforms"
        required: true
        default: "apple-silicon"
        type: choice
        options:
          - "apple-silicon"
          - "all-platforms"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin"
      asset-prefix: "nsm-flow-alpha"
      upload-artifacts: true
      sign-binaries: false

  additional-platforms:
    if: inputs.build_scope == 'all-platforms'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "nsm-flow-alpha"
      upload-artifacts: true
      sign-binaries: false
