name: NSMFlow
options:
  bundleIdPrefix: com.nathanielschool
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R3UNCZH45H
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  NSMFlow:
    type: application
    platform: iOS
    sources:
      - NSMFlow
      - Shared
    entitlements:
      path: NSMFlow/NSMFlow.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nathanielschool.nsmflow
    info:
      path: NSMFlow/Info.plist
      properties:
        CFBundleDisplayName: NSM Flow
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: NSM Flow listens only while you dictate, then turns your speech into text.
        NSSpeechRecognitionUsageDescription: NSM Flow turns your speech into text on this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: com.nathanielschool.nsmflow
            CFBundleURLSchemes: [nsmflow]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanielschool.nsmflow.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NSMKeyboard
  NSMKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - NSMKeyboard
      - Shared
    entitlements:
      path: NSMKeyboard/NSMKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nathanielschool.nsmflow
    info:
      path: NSMKeyboard/Info.plist
      properties:
        CFBundleDisplayName: NSM Flow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanielschool.nsmflow.ios.keyboard
